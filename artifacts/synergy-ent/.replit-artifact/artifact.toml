kind = "web"
previewPath = "/"
title = "Synergy ENT & Wellness"
version = "1.0.0"
id = "artifacts/synergy-ent"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25522

[services.development]
run = "pnpm --filter @workspace/synergy-ent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/synergy-ent", "run", "build" ]
publicDir = "artifacts/synergy-ent/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25522"
BASE_PATH = "/"
